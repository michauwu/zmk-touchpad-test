CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_TPS43=y

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# The default input thread stack is too small for the TPS65 gesture handling
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# USB logging is enabled by the zmk-usb-logging snippet (see build.yaml).
# Uncomment for verbose touchpad driver output:
# CONFIG_INPUT_LOG_LEVEL_DBG=y
