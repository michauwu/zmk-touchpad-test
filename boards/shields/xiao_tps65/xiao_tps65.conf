CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_TPS43=y

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# The default input thread stack is too small for the TPS65 gesture handling
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# USB logging is enabled by the zmk-usb-logging snippet (see build.yaml).
# Uncomment for verbose touchpad driver output:
# CONFIG_INPUT_LOG_LEVEL_DBG=y

# Smoother Bluetooth pointer: ZMK defaults to a 7.5-15 ms interval with a slave
# latency of 30, which lets the link skip up to 30 intervals and makes motion choppy.
# Units: interval 1.25 ms (6 = 7.5 ms, 9 = 11.25 ms), timeout 10 ms.
# The host picks the final values; these are only the preferred ones.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
